name: Publish page preview

on:
  push:
    branches: ["main"]
    paths:
      - "html/**"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare visual preview
        run: |
          cp -R html _site
          sed -i 's@</head>@<meta name="robots" content="noindex, nofollow">\n</head>@' _site/index.html
      - name: Name this attempt's artifact
        id: artifact
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload HTML and assets
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: "_site"
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        env:
          PAGE_ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
        with:
          script: |
            for (let attempt = 0; attempt < 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100
              });
              if (data.artifacts.some(artifact => artifact.name === process.env.PAGE_ARTIFACT_NAME)) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Uploaded Pages artifact metadata is still unavailable');
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
