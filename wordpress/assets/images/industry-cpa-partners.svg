  <circle cx="85" cy="115" r="82" fill="#FFFFFF" stroke="#466359" stroke-width="2.6"/>
  <circle cx="85" cy="115" r="72" stroke="#6A9082" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 3"/>

  <!-- Radiating referral network nodes & arcs -->
  <g stroke="#6A9082" stroke-width="1.6" opacity="0.7">
    <!-- Top arc -->
    <path d="M40 50a85 85 0 0 1 90 0"/>
    <circle cx="40" cy="50" r="5" fill="#FFFFFF" stroke="#466359" stroke-width="2"/>
    <circle cx="85" cy="33" r="5" fill="#FFFFFF" stroke="#F36334" stroke-width="2"/>
    <circle cx="130" cy="50" r="5" fill="#FFFFFF" stroke="#466359" stroke-width="2"/>
  </g>

  <!-- The Central Firm Handshake (inside crest) -->
  <g id="crest-handshake" transform="translate(28, 85)">
    <!-- Left person / CPA suit sleeve -->
    <path d="M0 25h22v26H0z" fill="#466359" stroke="#466359" stroke-width="2.2"/>
    <!-- Left shirt cuff & hand -->
    <path d="M22 28h8v20h-8z" fill="#FFFFFF" stroke="#6A9082" stroke-width="1.8"/>
    <path d="M30 30l20 8-8 14-12-6" fill="#FFFFFF" stroke="#466359" stroke-width="2.4"/>
    
    <!-- Right person / Complete Controller sleeve with orange cuff -->
    <path d="M92 25h22v26H92z" fill="#466359" stroke="#466359" stroke-width="2.2"/>
    <path d="M84 28h8v20h-8z" fill="#FFF0EB" stroke="#F36334" stroke-width="2.0"/>
    <circle cx="88" cy="38" r="2.5" fill="#F36334" stroke="none"/>
    <path d="M84 32l-20 8 8 14 12-6" fill="#FFFFFF" stroke="#466359" stroke-width="2.4"/>

    <!-- Interlocking firm clasp -->
    <path d="M42 38h16M40 43h18M42 48h14" stroke="#466359" stroke-width="2.2"/>
    <!-- Partnership sparkle accent -->
    <path d="M57 14l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#F36334" stroke="none"/>
  </g>

  <!-- Upward Referral & Commission Growth Trendline (wraps below crest) -->
  <g stroke="#F36334" stroke-width="2.4">
    <!-- Growth curve -->
    <path d="M15 220c35 5 70-15 110-45l28-22"/>
    <!-- Arrow head -->
    <path d="M142 153h14v14"/>
  </g>

  <!-- Partner Commission & Benefits Card -->
  <g transform="translate(5, 235)">
    <rect width="160" height="52" rx="6" fill="#FFFFFF" stroke="#466359" stroke-width="2.0"/>
    <!-- Icon circle -->
    <circle cx="26" cy="26" r="14" fill="#F0F4F2" stroke="#6A9082" stroke-width="1.6"/>
    <path d="M22 26l3 3 6-7" stroke="#F36334" stroke-width="2.4"/>
    <!-- Metric text bars -->
    <line x1="50" y1="20" x2="142" y2="20" stroke="#466359" stroke-width="2.2"/>
    <line x1="50" y1="32" x2="115" y2="32" stroke="#6A9082" stroke-width="2.0"/>
  </g>
</g>

<!-- Ground baseline -->
<line x1="30" y1="375" x2="450" y2="375" stroke="#6A9082" stroke-width="1.6"/>
</svg>